  <rect x="36" y="20" width="4" height="20" rx="2" fill="#8C2F12"/>
  <rect x="42" y="20" width="4" height="20" rx="2" fill="#8C2F12"/>
  <rect x="30" y="34" width="16" height="10" rx="4" fill="#8C2F12"/>
  <rect x="35.5" y="40" width="5" height="40" rx="2.5" fill="#8C2F12"/>
  <!-- La cuchara (derecha) -->
